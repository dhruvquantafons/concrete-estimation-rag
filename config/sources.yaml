# Source registry: one entry per document in data/.
# Paths are relative to the project root. Add new documents here, then run `crag ingest`.
#
#   doc_type : is_code | is_amendment | sor | dar (CPWD analysis of rates) | sor_reference (clean earlier printing)
#   ocr      : auto (score the text layer per page; re-OCR garbled/empty pages)
#              force (OCR every page - use for poor scans)  | never
#   amends   : for amendment slips, the doc_id they modify
#   is_current: false => excluded from retrieval by default (superseded editions)

defaults:
  ocr: auto
  is_current: true

documents:
  # ---------------- IS 456 : Plain and reinforced concrete ----------------
  - doc_id: IS456_2000
    path: data/IS 456/is.456.2000.pdf
    doc_type: is_code
    code_no: IS 456
    title: Plain and Reinforced Concrete - Code of Practice (Fourth Revision)
    revision_year: 2000
    amendments_bundled: [1, 2, 3]         # amendment slips 1-3 are bound inside this PDF (pp. 11-20)
    ocr: force                            # embedded text layer is a poor legacy OCR

  # ---------------- IS 10262 : Mix proportioning ----------------
