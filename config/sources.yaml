  # Clean copy of the ORIGINAL DSR 2023 printing (July/Aug 2023, before the correction slips the scans above include).
  # It has PRIORITY over the scans (owner's decision, 2026-10-28): codes, descriptions, units, cement coefficients and
  # rates come from it wherever it has the item. Where its rate differs from the scan's, the row is listed for review.
  # The scans still supply items the clean copy does not have.
  - doc_id: CPWD_DSR_2023_HQ_V1
    path: data/CPWD SOR HQ/Schedule_of_Rates_Vol_1_Civil.pdf
    doc_type: sor_reference
    reference_for: CPWD_DSR_2023_V1
    code_no: CPWD DSR
    title: CPWD Delhi Schedule of Rates 2023 (Civil) Vol. 1 - original printing (Aug 2023), clean copy
    revision_year: 2023
    sor_name: CPWD-DSR
    region: Delhi
