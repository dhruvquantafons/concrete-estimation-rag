# Rate build-up exactly as in CPWD Delhi Analysis of Rates (DAR) 2023. The parser read these from the
# analyses: 2,604 of them use this build-up (mortars have none: they are priced at cost):
#   W = material + labour + hire + carriage + sundries
#   X = W + water charges (1 % of W)
#   Y = X + GST (X x multiplying factor 0.2127)
#   Z = Y + contractor's profit & overheads (15 % of Y)
#   rate = Z + labour cess (1 % of Z), "Say" rounded to Rs 0.05
# DSR item rates already include all of these. For an existing DSR item, prefer GET /v1/rates/{code}/analysis
# (the DAR analysis itself) and POST /v1/rates/{code}/reprice (same analysis, other basic rates).
source: "CPWD DAR 2023 (14.09.2023), every analysis"
verified_by: "CPWD DAR 2023 (read from the analyses)"
water_charges_percent: 1.0
gst_factor: 0.2127
contractor_profit_overheads_percent: 15.0
cess_percent: 1.0

# Optional user templates for work that has no DAR analysis: coefficients per unit of item, priced from basic
# rates (01 hire / 02 labour / 03 materials codes; DAR's digital copy is used first). Templates with status
# 'example' are refused by the API unless allow_example=true.
templates:
  example_rcc_design_mix_m25_per_m3:
    status: example
    unit: m3
    description: "EXAMPLE ONLY - replace coefficients with DAR 2023 analysis for item 5.33.x"
    materials:            # basic-rate code -> quantity per unit of item (in the basic rate's unit)
      # "<cement code>": 0.36       # tonne
    labour:               # labour code -> man-days per unit
      # "0114": 1.0                 # Beldar
    hire:                 # hire-charge code -> days per unit
      # "0002": 0.07                # concrete mixer
    sundries_lump: 0.0
