# Maps measured quantities (from calc.quantities) to CPWD DSR 2023 items.
# Each rule: match on element type / level / grade (design mix or nominal mix), gives the SOR item code.
# Codes below were checked against the parsed DSR 2023 (see data/processed/sor_items.csv).
# Change / extend for your specification, or for a State PWD SOR once ingested.
sor_name: CPWD-DSR
sor_year: 2023

concrete:
  # Design mix RCC (5.33.1 up to plinth, 5.33.2 above plinth up to floor V level). Index by grade.
  design_mix:
    below_plinth: {M25: "5.33.1.1", M30: "5.33.1.2", M35: "5.33.1.3", M40: "5.33.1.4", M50: "5.33.1.5"}
    above_plinth: {M25: "5.33.2.1", M30: "5.33.2.2", M35: "5.33.2.3", M40: "5.33.2.4", M50: "5.33.2.5"}
  # Nominal mix RCC 1:1.5:3 (~M20)
  nominal_mix:
    below_plinth: {default: "5.1.2"}
    above_plinth:
      column: "5.2.2"
      wall: "5.2.2"
      beam: "5.3"
      slab: "5.3"
      lintel: "5.3"
      chajja: "5.3"
      staircase_waist: "5.3"
      default: "5.3"
  pcc:                       # plain cement concrete, all work up to plinth level
    "1:4:8": "4.1.8"
    "1:5:10": "4.1.10"
    "1:3:6": "4.1.5"
    "1:2:4": "4.1.3"
  above_floor_v_extra: "5.38"   # extra per cum for each four floors above floor V (apply n times)

formwork:                    # centering & shuttering (per m2)
  footing: "5.9.1"
  pcc_bed: "5.9.1"
  wall: "5.9.2"
  slab: "5.9.3"
  beam: "5.9.5"
  lintel: "5.9.5"
  column: "5.9.6"
  staircase_waist: "5.9.7"
  chajja: "5.9.19"

reinforcement:               # per kg; 5.22 = up to plinth level, 5.22A = above plinth level (DSR p.110)
  below_plinth: "5.22.6"     # TMT Fe-500D or more
  above_plinth: "5.22A.6"
  default: "5.22.6"
