# Curated IS 10262 : 2019 values (the source PDF is digital, so these cross-check cleanly).

table_1_x_factor:
  source: {code: IS 10262, table: "1", chunk: "IS10262_2019:table:1", clauses: ["4.2"]}
  title: Value of X (target strength margin)
  verified_by: "admin"
  verified_on: "2026-10-23"
  bands: [[10, 15, 5.0], [20, 25, 5.5], [30, 60, 6.5], [65, 999, 8.0]]   # [from grade, to grade, X]

table_2_assumed_sd:
  source: {code: IS 10262, table: "2", chunk: "IS10262_2019:table:2", clauses: ["4.2.1.3"]}
  title: Assumed standard deviation S (N/mm2), good site control
  verified_by: "admin"
  verified_on: "2026-10-23"
  bands: [[10, 15, 3.5], [20, 25, 4.0], [30, 60, 5.0], [65, 80, 6.0]]
  fair_control_increase: 1.0     # Table 2 note: values for good control; add 1 N/mm2 for fair control

table_3_entrapped_air:
  source: {code: IS 10262, table: "3", chunk: "IS10262_2019:table:3", clauses: ["5.2"]}
  title: Approximate entrapped air (% of volume of concrete)
  verified_by: "admin"
  verified_on: "2026-10-23"
  by_size_mm: {10: 1.5, 20: 1.0, 40: 0.8}

table_4_water_content:
  source: {code: IS 10262, table: "4", chunk: "IS10262_2019:table:4", clauses: ["5.3"]}
  title: Water content per m3 for 50 mm slump, angular aggregate, SSD (kg)
  verified_by: "admin"
  verified_on: "2026-10-23"
  by_size_mm: {10: 208, 20: 186, 40: 165}
  slump_adjust_percent_per_25mm: 3          # 5.3
  aggregate_shape_reduction_kg: {angular: 0, sub_angular: 10, gravel_with_crushed: 15, rounded_gravel: 20}

table_5_coarse_aggregate_volume:
  source: {code: IS 10262, table: "5", chunk: "IS10262_2019:table:5", clauses: ["5.5"]}
  title: Volume of coarse aggregate per unit volume of total aggregate at w/c 0.50
  verified_by: "admin"
  verified_on: "2026-10-23"
  zones: [zone_IV, zone_III, zone_II, zone_I]
  by_size_mm:
    10: [0.54, 0.52, 0.50, 0.48]
    20: [0.66, 0.64, 0.62, 0.60]
    40: [0.73, 0.72, 0.71, 0.69]
  wc_correction_per_0_05: 0.01              # 5.5.1: +0.01 for every 0.05 decrease in w/c (and vice versa)
  pumpable_reduction_max: 0.10              # 5.5.2: reduce CA content up to 10 % for pumping / congested steel

fig_1_wc_vs_strength:
  source: {code: IS 10262, figure: "1", clauses: ["5.1"]}
  title: Relationship between free w/c ratio and 28-day compressive strength (curves 1/2/3 for OPC 33/43/53)
  # Digitized 2026-10-21 from the native image of Fig. 1 (IS10262_2019.pdf p.6): grid lines fitted
  # individually (scan is ~0.4 deg rotated), curves traced column by column and fitted as ln(S) quadratic in
  # w/c; fit residual <= 0.3 N/mm2. Points are [28-day strength N/mm2, free w/c] at w/c steps of 0.025.
  # Cross-check: the Annex A/B/E examples read 0.36 / 0.43 for 48.25 / 38.25 N/mm2 on curve 2; this table gives
  # 0.350 / 0.425 - the examples are rounded eyeball readings, this follows the drawn curve (slightly lower w/c).
  # Outside a curve's strength range the calculator clamps to the end point and warns.
  # Re-measured 2026-10-22 by an independent digitizer: all 51 points within 0.28 N/mm2 (mean 0.10).
  verified_by: "claude-vision (pixel-digitized, +/-0.3 N/mm2)"
  verified_on: "2026-10-21"
  curves:
    curve_1_opc33: [[14.5, 0.650], [15.9, 0.625], [17.4, 0.600], [19.1, 0.575], [20.9, 0.550], [22.9, 0.525], [25.1, 0.500], [27.4, 0.475], [30.0, 0.450], [32.8, 0.425], [35.8, 0.400], [39.1, 0.375], [42.6, 0.350], [46.5, 0.325], [50.6, 0.300], [55.2, 0.275], [60.1, 0.250]]
    curve_2_opc43: [[18.7, 0.650], [20.3, 0.625], [22.0, 0.600], [23.8, 0.575], [25.8, 0.550], [27.9, 0.525], [30.2, 0.500], [32.6, 0.475], [35.3, 0.450], [38.2, 0.425], [41.3, 0.400], [44.7, 0.375], [48.3, 0.350], [52.2, 0.325], [56.4, 0.300], [60.9, 0.275], [65.7, 0.250]]
    curve_3_opc53: [[24.7, 0.650], [26.5, 0.625], [28.4, 0.600], [30.4, 0.575], [32.5, 0.550], [34.8, 0.525], [37.3, 0.500], [40.0, 0.475], [42.8, 0.450], [45.9, 0.425], [49.2, 0.400], [52.7, 0.375], [56.4, 0.350], [60.4, 0.325], [64.7, 0.300], [69.4, 0.275], [74.3, 0.250]]
