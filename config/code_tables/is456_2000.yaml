# Curated IS 456 : 2000 values used by the deterministic calculators.
#
# WHY CURATED: the IS 456 PDF in data/ is a legacy scan; its OCR text is good enough for retrieval
# but not for arithmetic (e.g. Table 5 'Extreme' plain-concrete cement content OCRs as 480 instead of 280).
# These values are entered from the standard and automatically cross-checked against the OCR text
# with `crag verify-tables`. A table is only marked `verified` after a human compares it with the
# licensed copy and fills in `verified_by` / `verified_on`.
#
# source.chunk = docstore chunk used for the automatic cross-check.

table_5_durability:
  source: {code: IS 456, table: "5", chunk: "IS456_2000:table:5", clauses: ["6.1.2", "8.2.4.1", "9.1.2"]}
  title: Minimum cement content, maximum w/c ratio and minimum grade for different exposures (20 mm aggregate)
  verified_by: null
  verified_on: null
  columns: [exposure, pcc_min_cement_kg_m3, pcc_max_wc, pcc_min_grade, rcc_min_cement_kg_m3, rcc_max_wc, rcc_min_grade]
  rows:
    - [mild,        220, 0.60, null, 300, 0.55, M20]
    - [moderate,    240, 0.60, M15,  300, 0.50, M25]
    - [severe,      250, 0.50, M20,  320, 0.45, M30]
    - [very_severe, 260, 0.45, M20,  340, 0.45, M35]
    - [extreme,     280, 0.40, M25,  360, 0.40, M40]
  notes:
    - Cement content is irrespective of cement grade and inclusive of additions (fly ash/GGBS) per 5.2.
    - Max cement content (8.2.4.2) - cement content not including fly ash and GGBS in excess of 450 kg/m3 should not be used unless special consideration.
  adjustments_table_6:   # IS 456 Table 6: adjustment to minimum cement content for aggregate size other than 20 mm
    10: +40
    20: 0
    40: -30

table_16_nominal_cover:
  source: {code: IS 456, table: "16", chunk: "IS456_2000:table:16", clauses: ["26.4.2"]}
  title: Nominal cover to meet durability requirements (mm)
  verified_by: null
  verified_on: null
  columns: [exposure, nominal_cover_mm]
  rows:
    - [mild, 20]
    - [moderate, 30]
    - [severe, 45]
    - [very_severe, 50]
    - [extreme, 75]
  notes:
    - "Note 1: for main reinforcement up to 12 mm bar in mild exposure the nominal cover may be reduced by 5 mm."
    - "Note 3: for severe and very severe exposure a reduction of 5 mm may be made where concrete grade is M35 and above."
  member_minimums:            # 26.4.2.1 / 26.4.2.2
    column_longitudinal_mm: 40      # not less than 40 mm nor less than bar diameter
    column_small_mm: 25             # columns with min dimension <= 200 mm and bars <= 12 mm
    footing_mm: 50

