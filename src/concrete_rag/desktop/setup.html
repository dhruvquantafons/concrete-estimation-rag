<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BuildMore AI</title>
  <style>
    /* Same tokens as api/ui/styles.css: blue & white, light only. Offline: system fonts only. */
    :root {
      --bg: #f2f5fa; --panel: #ffffff; --panel-3: #e8edf5; --border: #dce3ee;
      --text: #15233d; --muted: #4a5a77; --muted-2: #687897;
      --accent: #1a5cf0; --accent-2: #1347c4; --accent-soft: #ebf2ff; --sky: #4f8cff;
      --bad: #dc2626; --bad-soft: #fef2f2;
      --shadow-xl: 0 24px 48px -20px rgba(21, 35, 61, .22);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg) radial-gradient(1200px 500px at 50% -10%, rgba(45, 91, 185, .09), transparent);
      color: var(--text); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 16px; user-select: none; }
    .card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow-xl); padding: 32px 32px 28px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand b { color: var(--accent); }
    .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted-2); }
    h1 { font-size: 22px; letter-spacing: -.02em; margin: 26px 0 4px; }
    p { margin: 0; color: var(--muted); }
    .bar { height: 10px; background: var(--panel-3); border-radius: 99px; overflow: hidden; margin: 22px 0 10px; }
    .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--sky));
      transition: width .4s ease; }
    .indet .fill { width: 35% !important; animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row b { color: var(--text); font-weight: 600; }
    .err { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 13px; }
    button { display: none; margin-top: 14px; border: 0; border-radius: 10px; padding: 10px 18px; font: 600 14px var(--font);
      background: var(--accent); color: #fff; cursor: pointer; }
    button:hover { background: var(--accent-2); }
    .note { margin-top: 22px; font-size: 12px; color: var(--muted-2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1a5cf0"/><path d="M8 23V12l8-4 8 4v11M12 23v-6h8v6" stroke="white" stroke-width="2.4" fill="none" stroke-linejoin="round"/></svg>
      <span>BuildMore<b> AI</b><small>Concrete and Costs</small></span>
    </div>
    <h1 id="title">Downloading Resources</h1>
    <p id="sub">This happens once. You can keep using your computer while it finishes.</p>
    <div class="bar indet" id="bar"><div class="fill" id="fill"></div></div>
    <div class="row"><span><b id="pct"></b> <span id="amount"></span></span><span id="speed"></span></div>
    <div class="row" style="margin-top:4px"><span></span><span id="eta"></span></div>
    <div class="err" id="err"></div>
    <button id="retry" type="button">Try again</button>
    <p class="note" id="note">Please keep this window open and stay connected to the internet.</p>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const TEXT = {
      preparing: ["Downloading Resources", "Getting ready…"],
      downloading: ["Downloading Resources", "This happens once. You can keep using your computer while it finishes."],
      verifying: ["Downloading Resources", "Checking the downloaded files…"],
      starting: ["Starting BuildMore AI", "Just a moment…"],
      error: ["Downloading Resources", ""],
    };
    function render(s) {
      const [title, sub] = TEXT[s.phase] || TEXT.preparing;
      $("title").textContent = title;
      $("sub").textContent = sub || $("sub").textContent;
      const counting = s.phase === "downloading" || s.phase === "error";
      $("bar").classList.toggle("indet", !counting);
      $("fill").style.width = counting ? s.percent + "%" : "";
      $("pct").textContent = counting ? Math.floor(s.percent) + "%" : "";
      $("amount").textContent = counting ? "· " + s.amount : "";
      $("speed").textContent = s.phase === "downloading" ? s.speed : "";
      $("eta").textContent = s.phase === "downloading" ? s.eta : "";
      $("err").style.display = s.phase === "error" ? "block" : "none";
      $("err").textContent = s.message || "";
      $("retry").style.display = s.phase === "error" && s.retry !== false ? "inline-block" : "none";
      $("note").style.display = s.phase === "starting" ? "none" : "";
    }
    $("retry").onclick = () => { window.pywebview.api.retry(); render({ phase: "preparing" }); };
    async function poll() {
      try { if (window.pywebview && window.pywebview.api) render(await window.pywebview.api.progress()); }
      catch (e) { /* bridge not ready yet */ }
      setTimeout(poll, 500);
    }
    poll();
  </script>
</body>
</html>
