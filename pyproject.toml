[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-rag"
version = "0.1.0"
description = "RAG + deterministic estimation over IS codes and CPWD SOR for concrete works"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "qdrant-client>=1.10",
  "sentence-transformers>=3.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "slowapi>=0.1.9",
  "pint>=0.23",
  "reportlab>=4.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# desktop window (the Windows installer is built by packaging/windows/build_on_mac.sh)
desktop = ["pywebview>=5.3"]

[project.scripts]
crag = "concrete_rag.cli:app"
buildmore-desktop = "concrete_rag.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concrete_rag = ["api/ui/*", "desktop/setup.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs models / full corpus"]
