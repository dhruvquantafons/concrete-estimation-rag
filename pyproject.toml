[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concrete-rag"
version = "0.1.0"
description = "RAG + deterministic estimation over IS codes and CPWD SOR for concrete works"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pillow>=10",
  "numpy>=1.26",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "qdrant-client>=1.10",
  "sentence-transformers>=3.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "slowapi>=0.1.9",
  "pint>=0.23",
  "jinja2>=3.1",
  "reportlab>=4.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
tables = ["camelot-py[base]>=0.11", "tabula-py>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
crag = "concrete_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concrete_rag = ["api/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs models / full corpus"]
